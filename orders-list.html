<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALCo Delivery Tracking - All Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-3 py-2">
    <span class="navbar-brand fw-bold text-primary">ALCo Delivery Tracking</span>
</nav>

<div class="container mt-4">
    <h3>All Orders</h3>

    <table class="table table-bordered table-striped mt-3">
        <thead class="table-light">
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Order</th>
                <th>Delivery Note</th>
            </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>
</div>

<script>
// Load all orders
async function loadOrders() {
    const res = await fetch("https://alco-backend-yabe.onrender.com/api/orders");
    const orders = await res.json();
  orders.sort((a, b) => {
    const dateA = new Date(`${a.order_date} ${a.order_time}`);
    const dateB = new Date(`${b.order_date} ${b.order_time}`);
    return dateB - dateA; // newest first
});



    const table = document.getElementById("ordersTable");
    table.innerHTML = "";

    orders.forEach(order => {
        table.innerHTML += `
            <tr>
                <td>${order.order_id}</td>
                <td>${order.customer_name}</td>
              <td>${new Date(order.order_date).toLocaleDateString("en-GB")}</td>
                <td>${order.order_time}</td>
                <td>${order.status}</td>
                <td>
                <button class="btn btn-sm btn-info"
                    onclick="window.location.href='order-details-clean.html?id=${order.order_id}'">
                Order
                </button>
                </td>
                 <td>
            <button class="btn btn-primary btn-sm"
                onclick="openDeliveryNote(${order.order_id})">
                Delivery Note
            </button>
        </td>
            </tr>
        `;
    });
}
function openDeliveryNote(order_id) {
    window.location.href = "/deliveryNotes.html?id=" + order_id;
}


// Send order to warehouse (update status)
async function sendToWarehouse(order_id) {
    try {
        const res = await fetch(`https://alco-backend-yabe.onrender.com/api/orders/update-status/${order_id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: "Sent to Warehouse" })
        });

        const data = await res.json();

        if (data.success) {
            alert("Order sent to warehouse!");
            loadOrders(); // refresh table
        } else {
            alert("Failed to update order");
        }
    } catch (err) {
        alert("Failed to update order");
    }
}

loadOrders();
</script>

</body>
</html>
