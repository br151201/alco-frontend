<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALCo Delivery Tracking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            font-family: 'Segoe UI', sans-serif;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-3px);
        }

        .role-btn {
            padding: 14px;
            font-size: 17px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 600;
            border: none;
            transition: all 0.2s ease;
        }

        .role-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .header-title {
            font-weight: 700;
            font-size: 28px;
            color: #2c3e50;
        }

        .navbar-brand span {
            font-size: 20px;
        
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm px-3 py-2">
    <a class="navbar-brand d-flex align-items-center" href="role-select.html">
        <img src="alco-logo.png" height="40" class="me-2">
        <span class="fw-bold text-primary">ALCo Delivery Tracking</span>
    </a>
</nav>

<div class="container mt-5">
    <div class="dashboard-card mx-auto" style="max-width: 500px;">
        <h3 class="text-center header-title mb-4">Choose Your Role</h3>

        <button class="role-btn w-100" style="background:#007bff; color:white;"
                onclick="window.location.href='create-order.html'">
            Create New Order
        </button>

        <button class="role-btn w-100" style="background:#17a2b8; color:white;"
                onclick="location.href='orders-list.html'">
            View All Orders
        </button>

        <button class="role-btn w-100" style="background:#6c757d; color:white;"
                onclick="location.href='warehouse-orders.html'">
            Warehouse Orders
        </button>
    </div>
</div>

</body>
</html>
