<!DOCTYPE html>
<html>
<head>
    <title>Warehouse - Sales Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-3 py-2">
    <a class="navbar-brand d-flex align-items-center" href="role-select.html">
        <img src="alco-logo.png" height="40" class="me-2">
        <span class="fw-bold text-primary">Warehouse - Sales Orders</span>
    </a>
</nav>

<div class="container mt-4">
    <h3 class="mb-4">Warehouse Orders</h3>

    <table class="table table-bordered table-striped">
        <thead class="table-primary">
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Status</th>
                <th>Open</th>
            </tr>
        </thead>
        <tbody id="orders_table"></tbody>
    </table>
</div>

<script>
async function loadOrders() {
    const res = await fetch("https://alco-backend-yabe.onrender.com/api/orders");
    const orders = await res.json();
    orders.sort((a, b) => {
    const dateA = new Date(`${a.order_date} ${a.order_time}`);
    const dateB = new Date(`${b.order_date} ${b.order_time}`);
    return dateB - dateA; // newest first
});


    const table = document.getElementById("orders_table");
    table.innerHTML = "";

    orders.forEach(order => {
        const row = document.createElement("tr");

      row.innerHTML = `
    <td>${order.order_id}</td>
    <td>${order.customer_name}</td>
    <td>${order.order_date}</td>
    <td>${order.status || "Order Created"}</td>
    <td>
        <button class="btn btn-sm btn-primary"
            onclick="window.location.href = 'sales-order-details.html?id=' + ${order.order_id}"
             View
        </button>
    </td>
`;


        table.appendChild(row);
    });
}

loadOrders();
</script>

</body>
</html>
