<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delivery Note - ALCo Components Ltd</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f7f9fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .note-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        canvas {
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        .table th {
            background: #f1f1f1;
        }

        .header-line {
            border-bottom: 3px solid #0d6efd;
            margin-bottom: 20px;
        }

        .check-col {
            width: 40px;
            text-align: center;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm px-3 py-2">
    <a class="navbar-brand d-flex align-items-center" href="orders-list.html">
        <img src="alco-logo.png" height="40" class="me-2">
        <span class="fw-bold text-primary">ALCo Delivery Note</span>
    </a>
</nav>

<div class="container mt-4">
    <div id="note_box" class="note-card mx-auto" style="max-width: 900px;">
        <h3 class="note-title mb-3">Delivery Note</h3>
        <p class="text-muted">Loading delivery note...</p>
    </div>

    <button class="btn btn-secondary mt-3" onclick="history.back()">Back</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get("id");

// ⭐ PRODUCTION API BASE (Render)
let apiBase = "https://alco-backend-yabe.onrender.com";

if (!orderId || orderId === "null") {
    alert("Error: No order ID provided.");
    throw new Error("Missing order ID");
}

async function loadDeliveryNote() {
    const res = await fetch(`${apiBase}/api/delivery-notes/by-order/${orderId}`);
    const note = await res.json();
    const box = document.getElementById("note_box");

    if (!note || note.error) {
        box.innerHTML = `<div class="alert alert-danger">Delivery note not found.</div>`;
        return;
    }

    let itemsArray = [];
    if (Array.isArray(note.items)) itemsArray = note.items;
    else if (note.items && typeof note.items === "object") itemsArray = [note.items];

    itemsArray = itemsArray.map(item => ({
        description: item.description || "",
        quantity: Number(item.quantity) || 0
    }));

    let productRows = itemsArray.map(item => `
        <tr>
            <td class="check-col"><input type="checkbox"></td>
            <td>${item.description}</td>
            <td>${item.quantity}</td>
        </tr>
    `).join("");

    let signatureSection = "";

    if (note.delivery_status === "Delivered") {
        signatureSection = `
            <h5 class="fw-bold">Customer Signature</h5>
            <img src="${note.customer_signature}" width="300" class="border rounded mb-3">

            <div class="alert alert-success mt-3">
                Delivery Completed — Signature Locked
            </div>
        `;
    } else {
        signatureSection = `
            <h5 class="fw-bold">Customer Signature</h5>
            <canvas id="customerPad" width="300" height="120"></canvas>
            <button class="btn btn-sm btn-outline-danger mt-2" onclick="clearCustomerPad()">Clear</button>

            <hr>

            <button class="btn btn-success mt-3" onclick="markDelivered()">
                Mark as Delivered
            </button>                                   
        `;
    }

    box.innerHTML = `
        <div class="text-center mb-4">
            <img src="alco-logo.png" height="70" class="mb-2">
            <h2 class="fw-bold">ALCo Components Ltd</h2>
            <p class="text-muted">Suite 1 Majestic Building, Dewsbury, WF13 2BE</p>
            <div class="header-line"></div>
        </div>

        <h3 class="fw-bold mb-3 text-primary">Delivery Note</h3>

        <div class="row mb-4">
            <div class="col-6">
                <h5 class="fw-bold">Delivered To</h5>
                <p>
                    ${note.customer_name}<br>
                    ${note.address}<br>
                    ${note.customer_email || ""}
                </p>
            </div>

            <div class="col-6 text-end">
                <h5 class="fw-bold">Delivery Note No.</h5>
                <p>${note.delivery_note_id || note.id}</p>

                <h5 class="fw-bold">Order ID</h5>
                <p>${note.order_id}</p>

                <h5 class="fw-bold">Date</h5>
                <p>${new Date(note.created_at).toLocaleDateString()}</p>

                <h5 class="fw-bold">Driver</h5>
                <p>${note.driver_name || "Not Assigned"}</p>
            </div>
        </div>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th class="check-col">✔</th>
                    <th>Description</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody>${productRows}</tbody>
        </table>

        <hr>

        <h5 class="fw-bold">Special Notes</h5>
        <p>${note.note || "None"}</p>

        <hr>

        ${signatureSection}

        <hr class="mt-4">

        <div class="text-center text-muted small">
            <p>By signing, you confirm that goods are received in the stated quantity and condition.</p>
        </div>
    `;

    if (note.delivery_status !== "Delivered") setupPads();
}

// ⭐ SIGNATURE PAD
let customerPad, customerCtx, drawingCustomer = false;

function setupPads() {
    customerPad = document.getElementById("customerPad");
    customerCtx = customerPad.getContext("2d");

    customerPad.addEventListener("mousedown", () => drawingCustomer = true);
    customerPad.addEventListener("mouseup", () => { drawingCustomer = false; customerCtx.beginPath(); });
    customerPad.addEventListener("mousemove", drawCustomer);

    customerPad.addEventListener("touchstart", (e) => { drawingCustomer = true; e.preventDefault(); });
    customerPad.addEventListener("touchend", (e) => { drawingCustomer = false; customerCtx.beginPath(); e.preventDefault(); });
    customerPad.addEventListener("touchmove", (e) => {
        const rect = customerPad.getBoundingClientRect();
        const touch = e.touches[0];
        drawCustomer({ clientX: touch.clientX, clientY: touch.clientY, rect });
        e.preventDefault();
    });
}

function drawCustomer(e) {
    if (!drawingCustomer) return;
    const rect = e.rect || customerPad.getBoundingClientRect();
    customerCtx.lineWidth = 3;
    customerCtx.lineCap = "round";
    customerCtx.strokeStyle = "#000";
    customerCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    customerCtx.stroke();
    customerCtx.beginPath();
    customerCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
}

function clearCustomerPad() {
    customerCtx.clearRect(0, 0, customerPad.width, customerPad.height);
}

// ⭐ MARK DELIVERY COMPLETE
async function markDelivered() {
    const customerSignature = customerPad.toDataURL("image/png");

    const res = await fetch(`${apiBase}/api/delivery-notes/delivered/${orderId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            customer_signature: customerSignature
        })
    });

    const result = await res.json();

    if (result.success) {
        alert("Delivery Completed!");
        loadDeliveryNote();
    } else {
        alert("Failed to update delivery.");
    }
}

loadDeliveryNote();
</script>

</body>
</html>
