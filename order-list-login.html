<!DOCTYPE html>
<html>
<head>
    <title>Warehouse Login - ALCo</title>
    <style>
        body { font-family: Arial; background: #eef2f7; }
        .box {
            width: 350px; margin: 80px auto; background: white;
            padding: 25px; border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input { width: 100%; padding: 10px; margin-top: 10px; }
        button {
            width: 100%; padding: 10px; margin-top: 15px;
            background: #444; color: white; border: none;
            border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>All OrdersLogin</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;

    if (u === "office" && p === "office123") {
        localStorage.setItem("role", "order-list");
        window.location.href = "orders-list.html";
    } else {
        alert("Invalid order list login");
    }
}
</script>

</body>
</html>
