<!DOCTYPE html>
<html>
<head>
    <title>Driver Login - ALCo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-center mb-3">Driver Login</h3>

        <input id="email" class="form-control mb-3" type="email" placeholder="Email">
        <input id="password" class="form-control mb-3" type="password" placeholder="Password">

        <button class="btn btn-primary w-100" onclick="driverLogin()">Login</button>
    </div>
</div>

<script>
    const API_BASE = "https://alco-backend-yabe.onrender.com";

    async function driverLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
            alert("Please enter email and password");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/api/driver/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.success) {
                localStorage.setItem("driver_id", data.driver_id);
                localStorage.setItem("driver_name", data.driver_name);

                // ⭐ FINAL FIX — correct redirect
                window.location.href = "driver-dashboard.html";
            } else {
                alert(data.error || "Invalid email or password");
            }

        } catch (err) {
            console.error("LOGIN ERROR:", err);
            alert("Login failed. Server error.");
        }
    }
</script>

</body>
</html>
