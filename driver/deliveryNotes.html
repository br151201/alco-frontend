<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Delivery Note - ALCo Components Ltd</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f7f9fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .note-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        canvas {
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        .table th {
            background: #f1f1f1;
        }

        .header-line {
            border-bottom: 3px solid #0d6efd;
            margin-bottom: 20px;
        }

        .check-col {
            width: 40px;
            text-align: center;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm px-3 py-2">
    <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
        <img src="../alco-logo.png" height="40" class="me-2">
        <span class="fw-bold text-primary">Driver Delivery Note</span>
    </a>
</nav>

<div class="container mt-4">
    <div id="note_box" class="note-card mx-auto" style="max-width: 900px;">
        <h3 class="note-title mb-3">Delivery Note</h3>
        <p class="text-muted">Loading delivery note...</p>
    </div>

    <button class="btn btn-secondary mt-3" onclick="history.back()">Back</button>
</div>

<script>
async function loadDriverNote() {
    const params = new URLSearchParams(window.location.search);
    const noteId = params.get("id");

    if (!noteId) {
        document.getElementById("note_box").innerHTML =
            `<div class="alert alert-danger">Invalid delivery note ID.</div>`;
        return;
    }

    try {
        const res = await fetch(`https://alco-backend-yabe.onrender.com/api/delivery-notes/by-order/${noteId}`);
        const note = await res.json();

        if (!note) {
            document.getElementById("note_box").innerHTML =
                `<div class="alert alert-warning">Delivery note not found.</div>`;
            return;
        }

        document.getElementById("note_box").innerHTML = `
            <h3 class="mb-3">Delivery Note</h3>
            <div class="header-line"></div>

            <p><strong>Order ID:</strong> ${note.order_id}</p>
            <p><strong>Customer:</strong> ${note.customer_name}</p>
            <p><strong>Address:</strong> ${note.address}</p>
            <p><strong>Driver:</strong> ${note.driver_name}</p>
            <p><strong>Status:</strong> ${note.delivery_status}</p>

            <h5 class="mt-4">Items</h5>
            <ul>
                ${note.items.map(i => `<li>${i}</li>`).join("")}
            </ul>

            <h5 class="mt-4">Driver Note</h5>
            <p>${note.note || "No note added"}</p>
        `;
    } catch (err) {
        console.error("LOAD NOTE ERROR:", err);
        document.getElementById("note_box").innerHTML =
            `<div class="alert alert-danger">Failed to load delivery note.</div>`;
    }
}
</script>


</body>
</html>
